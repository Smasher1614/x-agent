name: X Agent

on:
  schedule:
    - cron: "*/10 * * * *"     # har 10 minute (UTC). GitHub kabhi-kabhi thoda late chalata hai.
  workflow_dispatch:            # Actions tab se haath se chalane ka button
    inputs:
      mode:
        description: "run = normal | preview = sirf sample dikhao (post nahi hoga)"
        required: true
        default: "preview"
        type: choice
        options: [preview, run]

permissions:
  contents: write               # state.json save karne ke liye

concurrency:
  group: x-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "preview" ]; then
            python bot.py --preview
          else
            python bot.py
          fi

      - name: Save state
        if: always() && github.event.inputs.mode != 'preview'
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "x-agent-bot"
            git config user.email "x-agent-bot@users.noreply.github.com"
            git add state.json
            git commit -m "bot: update state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
